[package]
name = "plotypus"
version = "0.0.0"
edition = "2024"
authors = ["Nick Spiker <fractaldecoder@proton.me>"]
description = "2D and 3D graphing calculator self-hosted on Spirix"
license-file = "LICENSE"

[[bin]]
name = "plotypus"
path = "src/main.rs"

[features]
default = []
logging = []
debug-keys = []
development = ["logging", "debug-keys"]

[dependencies]
spirix = { path = "../spirix" }

# Fluor owns the entire UI foundation: window, event loop, CPU softbuffer present,
# chrome (titlebar/buttons/drag/resize), text, hit-testing, and the Textbox/Button
# widgets. host-winit pulls winit + softbuffer (+ wgpu/arboard per-target internally).
fluor = { path = "../fluor", features = ["host-winit"] }

# Audio output for the Photon notification synthesizer (src/audio.rs)
cpal = "0.18.1"

# PNG decode for the app-icon orb (assets/plotypus.png → fluor::host::icon::Icon).
image = { version = "0.25", default-features = false, features = ["png"] }

# arboard: OS clipboard (read/write text). Not available on Redox so declared per-target.
[target.'cfg(not(target_os = "redox"))'.dependencies]
arboard = "3.6"

[profile.dev]
opt-level = 2
overflow-checks = false
debug = false
debug-assertions = false
lto = false
codegen-units = 16
incremental = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
overflow-checks = false
panic = "abort"
